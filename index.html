
<section class="girlfriend-letter">
  <h2>💌 Um espacinho só teu</h2>

  <p>Escreve aqui tua cartinha para o Ravi. ❤️</p>

  <textarea
    id="girlfriendMessage"
    placeholder="Escreve tua mensagem aqui..."
    rows="6"
  ></textarea>

  <div class="letter-buttons">
    <button id="copyGirlfriendMessage" type="button">
      Enviar cartinha 💌
    </button>

    <button id="clearGirlfriendMessage" type="button">
      Limpar
    </button>
  </div>

  <p id="messageFeedback" role="status" aria-live="polite"></p>
</section>
