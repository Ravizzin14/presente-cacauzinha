
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel do Ravi ❤️</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px;
      background: #09090d; color: #f5f5f5;
      font-family: Arial, sans-serif;
    }
    main { max-width: 760px; margin: 35px auto; }
    h1 { color: #ff303e; }
    .card {
      background: #15151d; border: 1px solid #34303c;
      border-radius: 16px; padding: 20px; margin: 16px 0;
    }
    input, button {
      width: 100%; padding: 13px; margin-top: 10px;
      border-radius: 9px; font-size: 16px;
    }
    input { background: #09090d; color: white; border: 1px solid #444; }
    button {
      background: #ff303e; color: white; border: 0;
      font-weight: bold; cursor: pointer;
    }
    button.secondary { background: #302c38; }
    .muted { color: #b8b4c2; }
    .message { white-space: pre-wrap; overflow-wrap: anywhere; }
    #status { white-space: pre-wrap; overflow-wrap: anywhere; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1>❤️ Painel do Ravi</h1>
  <p class="muted">Nosso cantinho privado • Ravi &amp; Cacauzinha</p>

  <section id="login" class="card hidden">
    <h2>Entrar no painel 🔒</h2>
    <form id="loginForm">
      <input id="email" type="email" placeholder="Teu e-mail"
        autocomplete="username" required>
      <input id="password" type="password" placeholder="Senha"
        autocomplete="current-password" required>
      <button type="submit">Entrar ❤️</button>
    </form>
    <button type="button" id="forgotPassword" class="secondary">
      Esqueci a senha
    </button>
  </section>

  <section id="newPassword" class="card hidden">
    <h2>Criar senha nova 🔐</h2>
    <form id="newPasswordForm">
      <input id="newPass" type="password" minlength="8"
        autocomplete="new-password" placeholder="Nova senha (mínimo 8 caracteres)"
        required>
      <input id="confirmPass" type="password" minlength="8"
        autocomplete="new-password" placeholder="Confirma a nova senha"
        required>
      <button type="submit">Guardar senha nova ❤️</button>
    </form>
  </section>

  <section id="dashboard" class="hidden">
    <div class="card">
      <h2>Cartinhas recebidas 💌</h2>
      <p class="muted">Mensagens guardadas no Supabase.</p>
      <button id="refresh">Atualizar cartinhas</button>
      <button id="logout" class="secondary">Sair da conta</button>
    </div>
    <div id="messages"></div>
  </section>

  <p id="status" class="muted" role="status" aria-live="polite"></p>
</main>

<script>
  // A URL base não deve terminar em /rest/v1/
  const SUPABASE_URL = "https://fghpeawhvvhmfijlrcvl.supabase.co";

  // Cola a tua chave anon public OU publishable entre estas aspas.
  const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZnaHBlYXdodnZobWZpamxyY3ZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5MTAzOTAsImV4cCI6MjEwNzQ4NjM5MH0.twZUqxKmlgyNOWXCwSP-yI7dBC0GJujMtUBKm06w8GE";

  const status = document.getElementById("status");
  const login = document.getElementById("login");
  const dashboard = document.getElementById("dashboard");
  const newPassword = document.getElementById("newPassword");
  const messages = document.getElementById("messages");

  let db = null;
  let recoveryMode = false;

  if (window.supabase &&
      SUPABASE_KEY !== "COLOCA_AQUI_TUA_CHAVE_PUBLICA" &&
      SUPABASE_KEY.length > 20) {
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  } else {
    status.textContent = "Falta colocar a chave pública do Supabase no código.";
  }

  function showScreen(screen) {
    login.classList.toggle("hidden", screen !== "login");
    dashboard.classList.toggle("hidden", screen !== "dashboard");
    newPassword.classList.toggle("hidden", screen !== "password");
  }

  async function loadMessages() {
    if (!db) return;
    status.textContent = "A carregar as cartinhas...";
    messages.replaceChildren();

    const { data, error } = await db
      .from("mensagens")
      .select("id, created_at, cartinha, respostas, remetente, finalizado")
      .order("created_at", { ascending: false });

    if (error) {
      status.textContent = "Erro ao carregar mensagens: " + error.message;
      return;
    }

    status.textContent = data.length
      ? data.length + " mensagem(ns) encontrada(s)."
      : "Ainda não há cartinhas guardadas.";

    for (const item of data) {
      const card = document.createElement("article");
      card.className = "card";

      const title = document.createElement("h2");
      title.textContent = "💌 " + (item.remetente || "Cartinha");

      const date = document.createElement("p");
      date.className = "muted";
      date.textContent = item.created_at
        ? new Date(item.created_at).toLocaleString("pt-BR")
        : "Data não informada";

      const letter = document.createElement("p");
      letter.className = "message";
      letter.textContent = item.cartinha || "Sem texto de cartinha.";

      const answerTitle = document.createElement("h3");
      answerTitle.textContent = "Respostas ❤️";

      const answers = document.createElement("pre");
      answers.className = "message";
      answers.textContent = JSON.stringify(item.respostas || {}, null, 2);

      card.append(title, date, letter, answerTitle, answers);
      messages.appendChild(card);
    }
  }

  document.getElementById("loginForm").addEventListener("submit",
    async (event) => {
      event.preventDefault();
      if (!db) return;

      status.textContent = "A entrar...";
      const { error } = await db.auth.signInWithPassword({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
      });

      if (error) {
        status.textContent = "Erro ao entrar: " + error.message;
        return;
      }

      recoveryMode = false;
      showScreen("dashboard");
      await loadMessages();
    }
  );

  document.getElementById("forgotPassword").addEventListener("click",
    async () => {
      if (!db) return;

      const email = document.getElementById("email").value.trim();
      if (!email) {
        status.textContent = "Escreve o teu e-mail no campo acima primeiro.";
        document.getElementById("email").focus();
        return;
      }

      status.textContent = "A enviar pedido de recuperação...";
      const { error } = await db.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + window.location.pathname
      });

      status.textContent = error
        ? "Não foi possível enviar: " + error.message
        : "Se a conta existir, receberás um e-mail de recuperação. Verifica também o spam.";
    }
  );

  document.getElementById("newPasswordForm").addEventListener("submit",
    async (event) => {
      event.preventDefault();
      if (!db || !recoveryMode) return;

      const pass = document.getElementById("newPass").value;
      const confirm = document.getElementById("confirmPass").value;

      if (pass.length < 8) {
        status.textContent = "A senha deve ter pelo menos 8 caracteres.";
        return;
      }
      if (pass !== confirm) {
        status.textContent = "As senhas não coincidem.";
        return;
      }

      status.textContent = "A guardar a senha nova...";
      const { error } = await db.auth.updateUser({ password: pass });

      if (error) {
        status.textContent = "Erro ao mudar a senha: " + error.message;
        return;
      }

      recoveryMode = false;
      document.getElementById("newPasswordForm").reset();
      status.textContent = "Senha alterada! Já podes entrar com a senha nova.";
      showScreen("login");
    }
  );

  document.getElementById("refresh").addEventListener("click", loadMessages);

  document.getElementById("logout").addEventListener("click", async () => {
    if (!db) return;
    await db.auth.signOut();
    recoveryMode = false;
    showScreen("login");
    messages.replaceChildren();
    status.textContent = "Saíste da conta.";
  });

  async function init() {
    if (!db) {
      showScreen("login");
      return;
    }

    const { data, error } = await db.auth.getSession();

    if (error) {
      status.textContent = "Erro ao verificar sessão: " + error.message;
    }

    if (data.session) {
      showScreen("dashboard");
      await loadMessages();
    } else {
      showScreen("login");
    }

    db.auth.onAuthStateChange(async (event, session) => {
      if (event === "PASSWORD_RECOVERY") {
        recoveryMode = true;
        showScreen("password");
        status.textContent = "Agora define a tua senha nova.";
      } else if (event === "SIGNED_IN" && !recoveryMode) {
        showScreen("dashboard");
      } else if (event === "SIGNED_OUT") {
        recoveryMode = false;
        showScreen("login");
      }
    });
  }

  init();
</script>
</body>
</html>
