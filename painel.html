
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Secreto ❤️</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #160b13;
      color: #fff0f6;
    }
    main {
      max-width: 760px;
      margin: 40px auto;
    }
    section, article {
      background: #281421;
      border: 1px solid #69304c;
      border-radius: 16px;
      padding: 20px;
      margin: 16px 0;
    }
    h1, h2 { color: #ff80b5; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border-radius: 9px;
      border: 1px solid #87405e;
      font-size: 16px;
    }
    input { background: #160b13; color: white; }
    button {
      background: #e84b89;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; }
    .muted { color: #d6b8c6; }
    #status { overflow-wrap: anywhere; }
  </style>
</head>
<body>
<main>
  <h1>❤️ Painel Secreto</h1>
  <p class="muted">Um cantinho privado para acompanhar as respostas e cartinhas.</p>

  <section id="loginBox">
    <h2>Entrar</h2>
    <form id="loginForm">
      <input id="email" type="email" placeholder="Teu e-mail do Supabase" required>
      <input id="password" type="password" placeholder="Tua senha" required>
      <button type="submit">Entrar no painel</button>
    </form>
  </section>

  <section id="content" hidden>
    <button id="refresh">Atualizar respostas</button>
    <button id="logout">Sair da conta</button>
    <div id="records"></div>
  </section>

  <p id="status" role="status" aria-live="polite"></p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://ektxoaljvogbeyyllwvw.supabase.co";
  const SUPABASE_KEY = "sb_publishable_JE4fy-T8wUDcmRUh0nO0Tw_Jum8bOaX";
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const status = document.getElementById("status");
  const loginBox = document.getElementById("loginBox");
  const content = document.getElementById("content");
  const records = document.getElementById("records");

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    status.textContent = "Verificando login...";
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const { error } = await db.auth.signInWithPassword({ email, password });
    if (error) {
      status.textContent = "Não foi possível entrar. Confere o e-mail e a senha.";
      return;
    }

    loginBox.hidden = true;
    content.hidden = false;
    await loadRecords();
  });

  async function loadRecords() {
    status.textContent = "Carregando...";
    records.replaceChildren();

    const { data, error } = await db
      .from("respostas_cacau")
      .select("*")
      .order("criado_em", { ascending: false });

    if (error) {
      status.textContent = "Erro ao carregar. Confere as políticas de acesso.";
      return;
    }

    if (!data || data.length === 0) {
      status.textContent = "Ainda não há respostas salvas.";
      return;
    }

    for (const item of data) {
      const card = document.createElement("article");
      const title = document.createElement("h2");
      title.textContent = item.cartinha ? "💌 Cartinha recebida" : "💖 Resultado do quiz";

      const date = document.createElement("p");
      date.className = "muted";
      date.textContent = "Recebido em: " +
        new Date(item.criado_em).toLocaleString("pt-BR");

      const details = document.createElement("pre");
      details.textContent = JSON.stringify({
        pontuacao: item.pontuacao,
        total_perguntas: item.total_perguntas,
        respostas: item.respostas,
        cartinha: item.cartinha,
        quiz_concluido: item.quiz_concluido,
        concluido_em: item.concluido_em
      }, null, 2);

      card.append(title, date, details);
      records.append(card);
    }

    status.textContent = "Registros carregados: " + data.length;
  }

  document.getElementById("refresh").addEventListener("click", loadRecords);

  document.getElementById("logout").addEventListener("click", async () => {
    await db.auth.signOut();
    content.hidden = true;
    loginBox.hidden = false;
    records.replaceChildren();
    status.textContent = "Tu saiu do painel.";
  });
</script>
</body>
</html>
